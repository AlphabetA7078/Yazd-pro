
name: Build Yazd PDR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir project
          unzip -q YAZD_PRO_ANDROID_PROJECT-1.zip -d project

      - name: Locate Gradle project
        run: |
          find project -name settings.gradle.kts -print

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          ROOT=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          cd "$ROOT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yazd-PDR-APK
          path: project/**/build/outputs/apk/debug/*.apk
